<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <!-- フォント読み込み -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600&display=swap" rel="stylesheet">
  <style>
    /* ===== グローバルリセット ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== ボディ設定 ===== */
    body {
      height: 100vh;                        /* ビューポート全体の高さ */
      display: flex;                        /* コンテナを中央揃えに */
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #667eea 0%,                         /* グラデーション開始色 */
        #764ba2 100%                       /* グラデーション終了色 */
      );
      font-family: 'Poppins', sans-serif;    /* モダンなサンセリフ体 */
      color: #ffffff;                        /* 文字色を白に */
    }

    /* ===== コンテナ ===== */
    .container {
      text-align: center;                   /* テキスト中央寄せ */
      padding: 0 20px;                      /* 横に余白を追加 */
    }

    /* ===== メインタイトル ===== */
    .title {
      font-size: 4rem;                      /* 大きめの文字サイズ */
      font-weight: 600;                     /* 太めのウェイト */
      margin-bottom: 1rem;                  /* 下部にマージン */
      text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* 文字に軽い影を付与 */
    }

    /* ===== サブタイトル ===== */
    .subtitle {
      font-size: 1.25rem;                   /* 少し大きめの本文サイズ */
      font-weight: 300;                     /* 細めのウェイト */
      opacity: 0.8;                         /* 半透明 */
      animation: pulse 2s ease-in-out infinite; /* 呼吸するようなアニメ */
    }

    /* ===== アニメーション定義 ===== */
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1;   }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- メインのメッセージ -->
    <h1 class="title">COMING SOON</h1>
    <!-- サブメッセージ -->
    <p class="subtitle">新しいウェブサイトを準備中です。もうしばらくお待ちください！</p>
  </div>
</body>
</html>
